<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自习室查询</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-primary navbar-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">校园信息中心</a>
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#mainNav"
                    aria-controls="mainNav" aria-expanded="false"
                    aria-label="切换导航">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
                    <li class="nav-item"><a class="nav-link active" href="study.html">自习室</a></li>
                    <li class="nav-item"><a class="nav-link" href="stats.html">统计</a></li>
                    <li class="nav-item"><a class="nav-link" href="three-d/scene.html">校园三维</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <main class="container my-5">
        <h1 class="h3 mb-3">自习室查询</h1>
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <div class="col-12 col-md-4">
                        <label for="floor-filter" class="form-label">楼层</label>
                        <select id="floor-filter" class="form-select">
                            <option value="all">全部楼层</option>
                            <option value="1楼">1楼</option>
                            <option value="2楼">2楼</option>
                            <option value="3楼">3楼</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-4">
                        <label for="status-filter" class="form-label">开放状态</label>
                        <select id="status-filter" class="form-select">
                            <option value="all">全部状态</option>
                            <option value="open">开放中</option>
                            <option value="closed">已关闭</option>
                        </select>
                    </div>
                    <div class="col-12 col-md-4">
                        <p class="text-muted mb-2" id="result-count"></p>
                    </div>
                </div>
            </div>
        </div>
        <div class="row g-4" id="room-list"></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/study.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
