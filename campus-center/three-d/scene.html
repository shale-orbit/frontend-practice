<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园三维导览</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <style>
        #scene-box { height: 70vh; min-height: 420px; }
        a-scene { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-primary navbar-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">校园信息中心</a>
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#mainNav"
                    aria-controls="mainNav" aria-expanded="false"
                    aria-label="切换导航">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">首页</a></li>
                    <li class="nav-item"><a class="nav-link" href="../study.html">自习室</a></li>
                    <li class="nav-item"><a class="nav-link" href="../stats.html">统计数据</a></li>
                    <li class="nav-item"><a class="nav-link active" href="scene.html">校园三维</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
            <h1 class="h3 mb-0">校园三维导览</h1>
            <a href="../index.html" class="btn btn-outline-primary btn-sm">返回首页</a>
        </div>
        <div class="card shadow-sm">
            <div class="card-body p-0 rounded overflow-hidden" id="scene-box">
                <a-scene embedded>
                    <a-sky color="#aee3f7"></a-sky>
                    <a-plane position="0 0 -4" rotation="-90 0 0"
                             width="20" height="20" color="#7cb342"></a-plane>
                    <a-box position="0 1.2 -6" width="4" height="2.4" depth="2" color="#efeeee"></a-box>
                    <a-box position="0 2.7 -6" width="4.4" height="0.4" depth="2.4" color="#b71c1c"></a-box>
                    <a-cylinder position="3 1.8 -5" radius="0.05" height="3.6" color="#9e9e9e"></a-cylinder>
                    <a-box position="3.35 3.3 -5" width="0.7" height="0.45" depth="0.03" color="#e53935"
                           animation="property: position; to: 3.4 3.3 -5; dir: alternate; dur: 900; loop: true">
                    </a-box>
                    <a-cylinder position="-3 1.2 -4" radius="0.06" height="2.4" color="#616161"></a-cylinder>
                    <a-sphere position="-3 2.5 -4" radius="0.18" color="#fff59d"
                              animation="property: scale; to: 1.3 1.3 1.3; dir: alternate; dur: 1200; loop: true">
                    </a-sphere>
                    <a-light type="point" position="-3 2.6 -4" color="#fff59d" intensity="0.6"></a-light>
                    <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
                    <a-camera position="0 1.8 2"></a-camera>
                </a-scene>
            </div>
        </div>
        <p class="text-muted mt-2 mb-0">操作提示：WASD 键行走，鼠标拖动环顾四周</p>
    </main>

    <script src="libs/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
