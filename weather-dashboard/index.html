<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>城市天气数据看板</title>
  <link href="libs/bootstrap.min.css" rel="stylesheet">
  <style>
    .chart-box { height: 360px; }
    #status { display: none; }
  </style>
</head>
<body class="container py-4">
  <header>
    <h1 class="h3">城市天气数据看板</h1>
    <p class="text-muted" id="sub-title">数据来源：模拟数据集</p>
  </header>

  <!-- 状态提示条：加载中 / 失败 / 空数据 -->
  <p id="status" class="alert alert-warning"></p>

  <!-- jQuery 交互区：城市切换按钮 -->
  <div id="city-switcher" class="btn-group mb-3" role="group"></div>

  <!-- 统计卡片 -->
  <section class="row g-3 mb-4" id="cards"></section>

  <!-- 图表区 -->
  <section class="row g-3">
    <div class="col-lg-6">
      <h2 class="h5">一周降水量对比(ECharts 柱状图)</h2>
      <p class="small text-muted">单位：毫米(mm) · 数据来源：模拟数据集</p>
      <div id="bar-chart" class="chart-box"></div>
    </div>
    <div class="col-lg-6">
      <h2 class="h5">温度变化趋势(Chart.js 折线图)</h2>
      <p class="small text-muted">单位：摄氏度(℃) · 数据来源：模拟数据集</p>
      <div class="chart-box"><canvas id="line-chart"></canvas></div>
    </div>
  </section>

  <script src="libs/jquery-3.7.1.min.js"></script>
  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="libs/echarts.min.js"></script>
  <script src="libs/chart.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
