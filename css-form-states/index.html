<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS表单状态探究</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>纯CSS表单状态实验</h1>
    <p>不写JavaScript,只用 :valid / :invalid / :focus 和属性选择器实现视觉反馈。</p>
    <form action="#" method="post">
        <p>
            <label for="username">用户名（必填）</label>
            <input type="text" id="username" name="username" required placeholder="至少2个字">
        </p>
        <p>
            <label for="email">邮箱（必填）</label>
            <input type="email" id="email" name="email" required placeholder="you@example.com">
        </p>
        <p>
            <label for="phone">手机号(必填，11位)</label>
            <input type="text" id="phone" name="phone" required
                   placeholder="11位手机号" pattern="1[3-9][0-9]{9}" maxlength="11">
        </p>
        <p>
            <label for="age">年龄(选填,1~120)</label>
            <input type="number" id="age" name="age" min="1" max="120" placeholder="选填">
        </p>
        <p>
            <label for="nickname">昵称(选填)</label>
            <input type="text" id="nickname" name="nickname" placeholder="选填">
        </p>
        <p>
            <input type="checkbox" id="agree" name="agree" required>
            <label for="agree">我已阅读并同意协议(必勾)</label>
        </p>
        <p>
            <button type="submit">提交</button>
        </p>
    </form>
</body>
</html>
