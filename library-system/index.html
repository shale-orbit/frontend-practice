<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>图书馆借阅登记表单收集</title>
    </head>
    <body>
        <header>
            <h1>图书馆借阅登记表单收集</h1>
            <p>欢迎来到图书馆借阅登记系统，填写以下信息即可完成借阅登记。</p>
        </header>
        <nav>
            <a href="#reader">借阅人信息</a>
            <a href="#book">图书信息</a>
            <a href="#loan">借阅设置</a>
        </nav>
        <main>
            <section id="reader">
                <h2>借阅人信息</h2>
                <p>填写借阅人的姓名、学号、联系方式等信息。</p>
            </section>
            <section id="book">
                <h2>图书信息</h2>
                <p>填写借阅的图书的名称、作者、ISBN等信息。</p>
            </section>
            <section id="loan">
                <h2>借阅设置</h2>
                <p>填写借阅的图书的借阅时间、归还时间等信息。</p>
            </section>
        </main>
        <footer>
            <p>校园图书馆 借阅登记系统</p>
        </footer>
    </body>
    </html>
