<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>联系人管理</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; }
    .form-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .form-row input { flex: 1; min-width: 140px; padding: 6px 8px; }
    button { padding: 6px 14px; cursor: pointer; }
    .tip { color: #c00; font-size: 14px; min-height: 20px; margin: 8px 0; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f5f5f5; }
    .actions button { margin-right: 4px; padding: 4px 8px; font-size: 13px; }
    .empty { text-align: center; color: #999; padding: 24px; }
  </style>
</head>
<body>
  <h1>联系人管理</h1>
  <h2 id="form-title">添加联系人</h2>
  <form id="contact-form">
    <div class="form-row">
      <input type="text" id="name" placeholder="姓名">
      <input type="text" id="phone" placeholder="电话">
      <input type="email" id="email" placeholder="邮箱">
      <button type="submit" id="submit-btn">添加</button>
      <button type="button" id="cancel-btn" style="display:none">取消</button>
    </div>
  </form>
  <p class="tip" id="tip"></p>
  <table>
    <thead>
      <tr><th>姓名</th><th>电话</th><th>邮箱</th><th style="width:140px">操作</th></tr>
    </thead>
    <tbody id="contact-list"></tbody>
  </table>
  <script src="app.js"></script>
</body>
</html>
